<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Supply Chain Operations</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap">
  <style>
    /* ============================================================
       Axis-aligned wall board, sized for a single TV frame.
       One committed dark theme, no scrolling, no explanatory copy.
       Each tile leads with its icon and its title at display size;
       every metric reads green (on target) or red (off target).
       Type scales in vh so one file reads on a 1080p or 4K panel.
       ============================================================ */
    :root {
      /* Grounds sit just off pure black and titles just off pure white:
         full-contrast black/white is what makes a wall board tiring. */
      --ink:       #08090B;
      --panel:     #0C0D10;
      --panel-hi:  #121418;
      --line:      #1E2025;
      --line-hi:   #2C2F36;
      --text:      #E3E7ED;   /* section titles */
      --title:     #C3CAD6;   /* tile titles */
      --muted:     #8C94A6;
      --dim:       #5A6070;
      --vermilion: #EF4023;   /* brand accent */
      --good:      #3FC584;   /* metric on target */
      --bad:       #F0503A;   /* metric off target */
      --s:         var(--muted); /* per-tile state colour, set by .s-good / .s-bad */
      --wash:      transparent;
      --mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", monospace;
      --sans: "Figtree", "Segoe UI", system-ui, sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--ink);
      color: var(--text);
      font-family: var(--sans);
      font-size: 15px;
      -webkit-font-smoothing: antialiased;
    }

    .app { display: flex; flex-direction: column; min-height: 100vh; }
    /* On a real panel the board is one frame, never a scroll. */
    @media (min-height: 700px) {
      .app { height: 100vh; overflow: hidden; }
    }

    /* ---------- top bar ---------- */
    .topbar {
      flex: 0 0 auto;
      height: clamp(56px, 6.2vh, 84px);
      border-bottom: 1px solid var(--line);
      background: var(--panel);
      display: flex;
      align-items: center;
      gap: clamp(14px, 1.6vw, 30px);
      padding: 0 clamp(16px, 1.7vw, 34px);
    }
    .lockup { display: flex; align-items: center; gap: clamp(10px, 1vw, 18px); flex: 0 0 auto; }
    .lockup img { height: clamp(20px, 2.6vh, 34px); width: auto; display: block; }
    .lockup .sep { width: 1px; height: clamp(20px, 2.8vh, 36px); background: var(--line-hi); }
    .lockup .mark {
      font-weight: 900;
      font-size: clamp(14px, 1.9vh, 25px);
      letter-spacing: -0.015em;
      white-space: nowrap;
    }
    .safety {
      display: flex; align-items: center; gap: 9px;
      border: 1px solid var(--line); background: var(--panel-hi);
      padding: clamp(5px, 0.7vh, 9px) clamp(9px, 0.9vw, 15px);
      font-family: var(--mono); font-size: clamp(10px, 1.15vh, 14px);
      color: var(--muted); letter-spacing: 0.04em; white-space: nowrap;
    }
    .safety b { font-family: var(--sans); font-weight: 700; color: var(--text); letter-spacing: 0; }
    .dot { width: 7px; height: 7px; border-radius: 50%; flex: 0 0 auto; }
    .dot.good { background: var(--good); }
    .dot.live { background: var(--good); animation: breathe 2.6s ease-in-out infinite; }
    .dot.dead { background: var(--bad); }
    @keyframes breathe {
      0%, 100% { box-shadow: 0 0 0 0 rgba(63, 197, 132, 0.45); }
      60%      { box-shadow: 0 0 0 5px rgba(63, 197, 132, 0); }
    }
    .bar-right {
      margin-left: auto;
      display: flex; align-items: center; gap: clamp(12px, 1.4vw, 26px);
      flex: 0 0 auto;
    }
    .sync {
      display: flex; align-items: center; gap: 8px;
      font-family: var(--mono); font-size: clamp(10px, 1.15vh, 14px); color: var(--muted);
      white-space: nowrap;
    }
    .today {
      font-weight: 600; font-size: clamp(12px, 1.6vh, 20px);
      letter-spacing: -0.01em; white-space: nowrap; color: var(--title);
    }

    /* ---------- board ---------- */
    .board {
      flex: 1; min-height: 0;
      display: flex; flex-direction: column;
      gap: clamp(10px, 1.5vh, 24px);
      padding: clamp(12px, 1.7vh, 26px) clamp(16px, 1.7vw, 34px) clamp(14px, 1.9vh, 28px);
    }
    .block { display: flex; flex-direction: column; min-height: 0; }
    .block.kpi { flex: 1 1 0; }
    .block.hw  { flex: 2 1 0; }
    .block.okr { flex: 0 0 auto; }

    h2 {
      margin: 0 0 clamp(7px, 1vh, 14px);
      padding-bottom: clamp(6px, 0.8vh, 12px);
      border-bottom: 1px solid var(--line);
      font-size: clamp(17px, 2.6vh, 36px);
      font-weight: 900;
      letter-spacing: -0.03em;
      line-height: 1;
    }

    /* ---------- hairline grids ---------- */
    .grid {
      flex: 1; min-height: 0;
      display: grid;
      gap: 1px;
      background: var(--line);
      grid-template-columns: repeat(6, minmax(0, 1fr));
    }
    .grid.hw-grid { grid-template-rows: repeat(2, minmax(0, 1fr)); }
    @media (max-width: 900px) {
      .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .grid.hw-grid { grid-template-rows: none; }
    }

    /* Every tile is either on target or off target - never neutral.
       --s carries that state into the value, icon, dot, stripe and spark,
       so the grid reads as colour fields instead of white text on black. */
    .cell {
      padding: clamp(10px, 1.3vh, 20px) clamp(11px, 1vw, 20px);
      display: flex; flex-direction: column;
      min-width: 0; min-height: 0;
      position: relative;
      background-color: var(--panel);
      background-image: linear-gradient(175deg, var(--wash), transparent 72%);
      box-shadow: inset 3px 0 0 var(--s);
    }
    .cell.s-good { --s: var(--good); --wash: rgba(63, 197, 132, 0.07); }
    .cell.s-bad  { --s: var(--bad);  --wash: rgba(240, 80, 58, 0.08); }
    .cell.s-idle { --s: var(--line-hi); --wash: transparent; }

    /* tile title: icon + name at display size, the way a wall board is read */
    .cell-top {
      display: flex; align-items: flex-start;
      gap: clamp(8px, 0.75vw, 14px);
      min-height: clamp(20px, 3vh, 40px);
    }
    .tile-icon {
      width: clamp(20px, 3vh, 40px); height: clamp(20px, 3vh, 40px);
      color: var(--s); opacity: 0.75; flex: 0 0 auto; margin-top: 0.06em;
    }
    .cell-label {
      flex: 1; min-width: 0;
      font-size: clamp(13px, 2.1vh, 29px);
      font-weight: 700;
      color: var(--title);
      letter-spacing: -0.02em;
      line-height: 1.12;
    }
    .cell-top .dot {
      width: clamp(7px, 1.05vh, 13px); height: clamp(7px, 1.05vh, 13px);
      background: var(--s);
      margin-left: auto; margin-top: 0.5em;
    }

    .cell-value {
      margin-top: auto;
      font-size: clamp(24px, 3.9vh, 54px);
      font-weight: 800; letter-spacing: -0.035em; line-height: 1;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      color: var(--s);
    }
    .cell-value .unit {
      font-size: clamp(11px, 1.7vh, 23px);
      font-weight: 600; opacity: 0.62; letter-spacing: 0; margin-left: 3px;
    }

    .cell-foot {
      display: flex; align-items: center; gap: clamp(6px, 0.6vw, 12px);
      margin-top: clamp(4px, 0.7vh, 11px);
      min-height: clamp(15px, 2.2vh, 30px);
    }
    .delta {
      font-family: var(--mono); font-size: clamp(9px, 1.15vh, 15px);
      color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums;
    }
    .qty {
      font-family: var(--mono); font-size: clamp(9px, 1.1vh, 14px);
      letter-spacing: 0.06em; text-transform: uppercase; color: var(--dim); white-space: nowrap;
    }
    .spark {
      margin-left: auto; flex: 0 0 auto;
      color: var(--s);
      width: clamp(44px, 4.6vw, 96px); height: clamp(15px, 2.2vh, 30px); display: block;
    }
    .spark polyline { opacity: 0.6; }

    /* KPI definition and source, for anyone reading the board on a laptop.
       Invisible on the wall; it never takes space in the tile. */
    .tip {
      position: absolute;
      top: calc(100% + 8px); left: 12px; right: 12px;
      background: var(--panel-hi);
      border: 1px solid var(--line-hi);
      padding: 13px 15px;
      z-index: 40;
      opacity: 0; visibility: hidden; pointer-events: none;
      transition: opacity 0.16s ease;
      box-shadow: 0 12px 34px rgba(0, 0, 0, 0.75);
    }
    .tip .def { font-size: 13px; line-height: 1.45; color: var(--title); font-weight: 400; }
    .tip .src {
      font-family: var(--mono); font-size: 11px; color: var(--muted);
      margin-top: 9px; letter-spacing: 0.04em;
    }
    .tip .src span { color: var(--dim); letter-spacing: 0.14em; margin-right: 5px; }
    .cell:hover .tip { opacity: 1; visibility: visible; }
    .cell:hover { z-index: 50; }

    /* ---------- objective ---------- */
    .okr-row {
      background: var(--panel);
      border-top: 1px solid var(--line);
      display: flex; align-items: center;
      gap: clamp(16px, 2vw, 40px);
      padding: clamp(10px, 1.4vh, 20px) clamp(12px, 1.2vw, 24px);
    }
    .okr-count {
      font-size: clamp(24px, 3.9vh, 54px); font-weight: 900;
      letter-spacing: -0.045em; line-height: 1; font-variant-numeric: tabular-nums;
      flex: 0 0 auto; color: var(--bad);
    }
    .okr-count.met { color: var(--good); }
    .okr-count span { opacity: 0.55; font-weight: 600; font-size: 0.55em; }
    .segs { display: flex; gap: clamp(3px, 0.35vw, 7px); flex: 1; min-width: 0; }
    .seg { height: clamp(8px, 1.3vh, 19px); flex: 1; background: var(--panel-hi); }
    .seg.on  { background: var(--good); }
    .seg.off { background: rgba(240, 80, 58, 0.22); box-shadow: inset 0 0 0 1px var(--bad); }

    @media (prefers-reduced-motion: reduce) {
      .dot.live { animation: none; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="lockup">
        <img src="pos360-logo.png" alt="POS360" />
        <div class="sep"></div>
        <div class="mark">Supply Chain Operations</div>
      </div>
      <div class="safety"><span class="dot good"></span> <b id="safetyDays">&mdash;</b> days incident-free</div>
      <div class="bar-right">
        <div class="sync"><span class="dot live" id="syncDot"></span> <span id="syncText">Connecting&hellip;</span></div>
        <div class="today" id="today"></div>
      </div>
    </header>

    <div class="board">
      <section class="block kpi">
        <h2>Operating KPIs</h2>
        <div class="grid" id="kpiGrid"></div>
      </section>

      <section class="block hw">
        <h2>Hardware Coverage</h2>
        <div class="grid hw-grid" id="hwGrid"></div>
      </section>

      <section class="block okr">
        <h2>All Categories &ge; 1 MOS</h2>
        <div class="okr-row">
          <div class="okr-count" id="okrCount">&mdash;<span> / 12</span></div>
          <div class="segs" id="segs"></div>
        </div>
      </section>
    </div>
  </div>

<script>
  const HARDWARE_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vT9rYJSXpvAv9-4Kkc20lHtU0jUAa8prJ4LEz0Jk3kYnM8VG_rOfaIyeOxL3jZKa1TYBYCreeoZmGia/pub?gid=0&single=true&output=csv";
  const KPI_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vT9rYJSXpvAv9-4Kkc20lHtU0jUAa8prJ4LEz0Jk3kYnM8VG_rOfaIyeOxL3jZKa1TYBYCreeoZmGia/pub?gid=1952869269&single=true&output=csv";
  const HISTORY_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vT9rYJSXpvAv9-4Kkc20lHtU0jUAa8prJ4LEz0Jk3kYnM8VG_rOfaIyeOxL3jZKa1TYBYCreeoZmGia/pub?gid=1174990261&single=true&output=csv";

  const REFRESH_MS = 5 * 60 * 1000;   // the board sits on a wall for weeks; keep it current
  const LAST_INCIDENT = "2024-04-22";

  /* ---------- icon set: thin stroke, monochrome, one per tile ---------- */
  const ICONS = {
    orderCheck: '<path d="M8 4h8a1 1 0 0 1 1 1v15a1 1 0 0 1-1 1H8a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1z"/><path d="M10 4V2.5h4V4"/><path d="M9.5 12.5l2 2 3.5-4"/>',
    truck:      '<path d="M2.5 7h10v9h-10z"/><path d="M12.5 10.5H17l3 3V16h-7.5z"/><circle cx="6.5" cy="18.5" r="1.8"/><circle cx="16.5" cy="18.5" r="1.8"/><path d="M8.3 18.5h6.4"/>',
    shrink:     '<path d="M3.5 8l8.5-4 8.5 4-8.5 4z"/><path d="M3.5 8v8l8.5 4 8.5-4V8"/><path d="M9 13.5h6"/>',
    poClock:    '<path d="M13 3H7a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1v-7"/><circle cx="17" cy="6.5" r="3.5"/><path d="M17 5v1.8l1.3.9"/><path d="M9 13h5M9 16.5h4"/>',
    pulse:      '<path d="M3 12.5h3.5L9 7l3 10 2.5-4.5H21"/>',
    alert:      '<path d="M12 4.5l8.5 15H3.5z"/><path d="M12 9.5v4.5M12 16.8v.01"/>',
    register:   '<rect x="6" y="6" width="12" height="12" rx="1.5"/><rect x="9.5" y="9.5" width="5" height="5" rx="0.5"/><path d="M9 6V3M15 6V3M9 21v-3M15 21v-3M6 9H3M6 15H3M21 9h-3M21 15h-3"/>',
    printer:    '<path d="M6 9V3h12v6"/><path d="M6 18H4a1 1 0 0 1-1-1v-5a1 1 0 0 1 1-1h16a1 1 0 0 1 1 1v5a1 1 0 0 1-1 1h-2"/><rect x="7" y="14" width="10" height="7" rx="1"/>',
    tablet:     '<rect x="5" y="3" width="14" height="18" rx="2"/><line x1="10" y1="18" x2="14" y2="18"/>',
    pinpad:     '<rect x="5" y="3" width="14" height="18" rx="2"/><rect x="8" y="6" width="8" height="4" rx="0.5"/><path d="M9 14h.01M12 14h.01M15 14h.01M9 17h.01M12 17h.01M15 17h.01"/>',
    tag:        '<path d="M19.5 12.5l-7 7a2 2 0 0 1-2.83 0L4 13.83V6a2 2 0 0 1 2-2h7.83l5.67 5.67a2 2 0 0 1 0 2.83z"/><circle cx="8.5" cy="8.5" r="1.3"/>',
    battery:    '<rect x="3" y="7" width="16" height="10" rx="2"/><path d="M22 10v4"/><path d="M11 9.5l-2 3h3l-2 3"/>',
    stand:      '<rect x="4" y="3" width="16" height="11" rx="1.5"/><path d="M12 14v4"/><path d="M8 21h8"/><path d="M12 18l-4 3M12 18l4 3"/>',
    scale:      '<path d="M12 3v16"/><path d="M7 19h10"/><path d="M5 6h14"/><path d="M5 6l-2.5 5a2.5 2.5 0 0 0 5 0z"/><path d="M19 6l-2.5 5a2.5 2.5 0 0 0 5 0z"/>',
    computer:   '<rect x="5" y="5" width="14" height="9" rx="1.5"/><path d="M2.5 18h19l-1.5-2.5H4z"/>',
    lcd:        '<rect x="3" y="4" width="18" height="12" rx="1.5"/><path d="M9 20h6"/><path d="M12 16v4"/>'
  };

  // Hardware categories, in board order, each with its instrument icon.
  // Names must match column A of the Hardware tab.
  const ITEMS = [
    { name: "360 Pro Primary",    icon: "register" },
    { name: "360 Pro Secondary",  icon: "register" },
    { name: "Receipt Printers",   icon: "printer"  },
    { name: "Tablets",            icon: "tablet"   },
    { name: "Pin Pads",           icon: "pinpad"   },
    { name: "Deal Tag Printer",   icon: "tag"      },
    { name: "Retail Tag Printer", icon: "tag"      },
    { name: "Backup Battery",     icon: "battery"  },
    { name: "Metal Stands",       icon: "stand"    },
    { name: "Scales",             icon: "scale"    },
    { name: "Sango Computer",     icon: "computer" },
    { name: "LCD Kits",           icon: "lcd"      }
  ];

  // Per KPI: which icon, and the rule that decides green or red. The definition
  // and source shown on hover come from columns C and D of the KPI tab, so the
  // sheet stays the single source of truth for that wording.
  const KPI_SPECS = [
    { match: "supply order success", icon: "orderCheck", ok: v => v >= 97 },
    { match: "on time fulfillment", icon: "truck",       ok: v => v >= 97 },
    { match: "shrink",              icon: "shrink",      ok: v => v > -2 && v <= 0 },
    { match: "on time po",          icon: "poClock",     ok: v => v >= 90 },
    { match: "stock health", alt: "supply chain stock", icon: "pulse", ok: v => v >= 97 },
    { match: "stock out",           icon: "alert",       ok: v => v >= 0 && v <= 2 }
  ];

  function kpiSpec(nameLower) {
    return KPI_SPECS.find(s => nameLower.includes(s.match) || (s.alt && nameLower.includes(s.alt)));
  }

  /* ---------- render helpers ---------- */
  function icon(name) {
    return '<svg class="tile-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"'
      + ' stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'
      + (ICONS[name] || ICONS.pulse) + '</svg>';
  }

  function spark(points) {
    if (!points || points.length < 2) return '';
    const values = points.map(p => p.value);
    const w = 74, h = 24, pad = 3;
    const min = Math.min(...values), max = Math.max(...values);
    const range = (max - min) || 1;
    const step = (w - 1) / (values.length - 1);
    const pts = values.map((v, i) => {
      const x = i * step;
      const y = h - pad - ((v - min) / range) * (h - pad * 2);
      return [x.toFixed(1), y.toFixed(1)];
    });
    const last = pts[pts.length - 1];
    return '<svg class="spark" viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="none" aria-hidden="true">'
      + '<polyline points="' + pts.map(p => p.join(',')).join(' ') + '" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>'
      + '<circle cx="' + last[0] + '" cy="' + last[1] + '" r="2.2" fill="currentColor"/></svg>';
  }

  // Week-over-week movement, stated plainly. Direction is not judged here:
  // the tile's colour already says whether the metric is passing.
  function weekChange(points) {
    if (!points || points.length < 2) return '';
    const delta = points[points.length - 1].value - points[points.length - 2].value;
    if (Math.abs(delta) < 0.05) return '▬ 0.0 vs LW';
    return (delta > 0 ? '▲ +' : '▼ −') + Math.abs(delta).toFixed(1) + ' vs LW';
  }

  // One tile shape for both grids: icon + title, then the value in its state colour.
  function tile(o) {
    return '<div class="cell ' + (o.state || 's-idle') + '">'
      + '<div class="cell-top">' + icon(o.icon)
      +   '<span class="cell-label">' + (o.name || '') + '</span>'
      +   '<span class="dot"></span>'
      + '</div>'
      + '<div class="cell-value">' + o.value + (o.unit ? '<span class="unit">' + o.unit + '</span>' : '') + '</div>'
      + '<div class="cell-foot">'
      +   (o.qty ? '<span class="qty">' + o.qty + '</span>' : '')
      +   (o.delta ? '<span class="delta">' + o.delta + '</span>' : '')
      +   (o.spark || '')
      + '</div>'
      + (o.tip || '')
      + '</div>';
  }

  function state(ok) { return ok ? 's-good' : 's-bad'; }

  /* ---------- chrome ---------- */
  function paintClock() {
    document.getElementById('today').textContent = new Date().toLocaleDateString(undefined, {
      weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
    });
    const days = Math.floor((new Date() - new Date(LAST_INCIDENT)) / 86400000);
    document.getElementById('safetyDays').textContent = days.toLocaleString();
  }

  // 'ok' | 'partial' (hardware landed, a feed did not) | 'fail'
  function paintSync(mode) {
    const time = new Date().toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
    const label = {
      ok:      'Synced · ' + time,
      partial: 'Synced · ' + time + ' · KPI feed offline',
      fail:    'Sync failed · ' + time
    }[mode];
    document.getElementById('syncDot').className = 'dot ' + (mode === 'ok' ? 'live' : 'dead');
    document.getElementById('syncText').textContent = label;
  }

  /* ---------- data ---------- */
  // The KPI tab quotes its definitions, and those definitions contain commas,
  // so the board needs a real CSV reader rather than a split on ",".
  function parseCsv(text) {
    const rows = [];
    let row = [], field = '', quoted = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (quoted) {
        if (c !== '"') { field += c; }
        else if (text[i + 1] === '"') { field += '"'; i++; }
        else { quoted = false; }
      } else if (c === '"') {
        quoted = true;
      } else if (c === ',') {
        row.push(field); field = '';
      } else if (c === '\n') {
        row.push(field); rows.push(row); row = []; field = '';
      } else if (c !== '\r') {
        field += c;
      }
    }
    if (field !== '' || row.length) { row.push(field); rows.push(row); }
    return rows;
  }

  const wait = ms => new Promise(resolve => setTimeout(resolve, ms));

  // Google answers an overloaded or unpublished tab with an HTML error page and
  // a 200, so check the body looks like CSV. Those errors are usually transient:
  // retry once before giving up on a feed.
  async function fetchCsv(url, attempts = 2) {
    let failure;
    for (let i = 0; i < attempts; i++) {
      try {
        const bust = (url.indexOf('?') > -1 ? '&' : '?') + '_=' + Date.now();
        const res = await fetch(url + bust, { cache: 'no-store' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const text = await res.text();
        if (text.trim().charAt(0) === '<') throw new Error('sheet returned an error page');
        return text;
      } catch (e) {
        failure = e;
        if (i < attempts - 1) await wait(2000);
      }
    }
    throw new Error(failure.message + ' - ' + url);
  }

  async function loadHistory() {
    try {
      const rows = parseCsv(await fetchCsv(HISTORY_CSV_URL));
      const headers = rows[0].map(h => h.trim());
      // Only rows with a real Week Ending date in column A count; the History
      // tab is columns A-S (Week Ending + 6 KPIs + 12 hardware categories).
      const data = rows.slice(1).filter(row => row[0] && row[0].trim());
      const history = {};
      headers.slice(1).forEach((name, i) => {
        history[name] = data
          .map(row => ({
            week: row[0].trim(),
            value: parseFloat((row[i + 1] || '').replace(/[^0-9.-]/g, ''))
          }))
          .filter(p => !isNaN(p.value));
      });
      return history;
    } catch (e) {
      console.error('History load failed', e);
      return {};
    }
  }

  function renderHardware(mosMap, qtyMap, history) {
    const safe = [];
    document.getElementById('hwGrid').innerHTML = ITEMS.map(item => {
      const mos = mosMap[item.name] || 0;
      const qty = qtyMap[item.name] || 0;
      const ok = mos >= 1;
      safe.push(ok);
      const points = history[item.name] || [];
      return tile({
        name: item.name,
        icon: item.icon,
        state: state(ok),
        value: mos.toFixed(1),
        unit: 'MOS',
        qty: qty.toLocaleString() + ' on hand',
        delta: weekChange(points),
        spark: spark(points)
      });
    }).join('');
    return safe;
  }

  function renderKpis(kpiRows, history, stockHealthPct) {
    const cards = kpiRows.map(row => {
      const nameRaw = (row[0] || '').trim();
      if (!nameRaw) return '';
      const nameLower = nameRaw.toLowerCase().replace(/\s+/g, ' ').trim();
      const spec = kpiSpec(nameLower);

      // Stock Health is derived from the hardware grid, not read from the sheet.
      const isStockHealth = nameLower.includes('stock health')
        || nameLower.includes('supply chain stock')
        || nameLower.includes('months of supply');

      let raw = (row[1] || '').trim();
      if (isStockHealth) raw = stockHealthPct.toFixed(0) + '%';

      const num = parseFloat(raw.replace(/[^0-9.-]/g, ''));
      const value = isNaN(num) ? '—' : raw.replace(/[%\s]/g, '').replace('-', '−');
      // Several KPI names carry the unit ("Total Shrink %"). Show it once, on
      // the number, and keep the tile title clean.
      const unit = (raw.indexOf('%') > -1 || nameRaw.indexOf('%') > -1) ? '%' : '';
      const title = nameRaw.replace(/\s*%\s*$/, '');
      const ok = spec && !isNaN(num) ? spec.ok(num) : false;
      const points = history[nameRaw] || [];

      // Definition and source live in columns C and D of the KPI tab.
      const def = (row[2] || '').trim();
      const src = (row[3] || '').trim();
      const tip = def || src
        ? '<div class="tip">'
          + (def ? '<div class="def">' + def + '</div>' : '')
          + (src ? '<div class="src"><span>SOURCE</span>' + src + '</div>' : '')
          + '</div>'
        : '';

      return tile({
        name: title,
        icon: spec ? spec.icon : 'pulse',
        state: state(ok),
        value: value,
        unit: unit,
        delta: weekChange(points),
        spark: spark(points),
        tip: tip
      });
    }).filter(Boolean);

    document.getElementById('kpiGrid').innerHTML = cards.length
      ? cards.join('')
      : tile({ name: 'No KPI data in the sheet', icon: 'alert', state: 's-bad', value: '—' });
  }

  // One segment per category, in grid order - so the gap in the bar sits where
  // the short category sits, not bunched at the end.
  function renderObjective(safe) {
    const safeCount = safe.filter(Boolean).length;
    const count = document.getElementById('okrCount');
    count.innerHTML = safeCount + '<span> / ' + ITEMS.length + '</span>';
    count.classList.toggle('met', safeCount === ITEMS.length);
    document.getElementById('segs').innerHTML = ITEMS
      .map((item, i) => '<div class="seg ' + (safe[i] ? 'on' : 'off') + '" title="' + item.name + '"></div>')
      .join('');
  }

  function renderKpisOffline() {
    document.getElementById('kpiGrid').innerHTML =
      '<div class="cell s-bad" style="grid-column: 1 / -1">'
      + '<div class="cell-top">' + icon('alert')
      +   '<span class="cell-label">KPI feed unavailable</span><span class="dot"></span>'
      + '</div>'
      + '<div class="cell-value">—</div>'
      + '<div class="cell-foot"><span class="delta">Sheet did not answer · retrying</span></div>'
      + '</div>';
  }

  // Once a feed has painted the wall, a later blip must not blank it.
  let kpisEverLoaded = false;

  async function load() {
    try {
      const [hwText, history] = await Promise.all([
        fetchCsv(HARDWARE_CSV_URL),
        loadHistory()
      ]);

      const mosMap = {}, qtyMap = {};
      parseCsv(hwText).slice(1).forEach(row => {
        const item = row[0] && row[0].trim();
        if (!item) return;
        qtyMap[item] = parseInt(row[1]) || 0;
        mosMap[item] = parseFloat(row[2]) || 0;
      });

      const safe = renderHardware(mosMap, qtyMap, history);
      const stockHealthPct = (safe.filter(Boolean).length / ITEMS.length) * 100;
      renderObjective(safe);

      // The KPI tab can be offline on its own; hardware still deserves the wall.
      let kpisOk = true;
      try {
        const kpiRows = parseCsv(await fetchCsv(KPI_CSV_URL)).slice(1);
        renderKpis(kpiRows, history, stockHealthPct);
        kpisEverLoaded = true;
      } catch (kpiError) {
        console.error('KPI load failed', kpiError);
        if (!kpisEverLoaded) renderKpisOffline();
        kpisOk = false;
      }

      paintClock();
      paintSync(kpisOk ? 'ok' : 'partial');
    } catch (error) {
      // Keep the last good numbers on the wall; only the sync badge changes.
      console.error('Board load failed', error);
      paintSync('fail');
    }
  }

  /* ---------- start: titles first, then numbers ---------- */
  function renderSkeleton() {
    document.getElementById('kpiGrid').innerHTML = KPI_SPECS
      .map(spec => tile({ icon: spec.icon, value: '—' }))
      .join('');
    document.getElementById('hwGrid').innerHTML = ITEMS
      .map(item => tile({ name: item.name, icon: item.icon, value: '—', unit: 'MOS' }))
      .join('');
    document.getElementById('segs').innerHTML = ITEMS.map(() => '<div class="seg"></div>').join('');
  }

  paintClock();
  renderSkeleton();
  load();

  setInterval(load, REFRESH_MS);
  setInterval(paintClock, 60 * 1000);
</script>
</body>
